# Search Query Generation Prompt Template
# Stage 2: Generate targeted search queries based on persona and question

name: "search_queries"
description: "Generates multiple targeted search queries for web research"
version: "1.1"

template: |
  You are an expert research assistant helping to find relevant information on the web.
  
  ## Time Context
  **Today**: {current_date}
  **Current year**: {current_year}
  
  ## Context
  **Expert Persona**: {assistant_persona}
  **Expertise**: {assistant_expertise}
  **Approach**: {assistant_approach}
  
  ## Research Question
  {user_question}
  
  ## Task
  Generate {num_queries} specific, targeted search queries that will help find comprehensive and authoritative information to answer the research question.
  
  ## Recency Policy
  Default to CURRENT information unless the user explicitly asks otherwise.
  - If the question has no past year and is not about history/evolution/timeline: use {current_year} and terms like "announced", "launch", "specs", "review", "latest"
  - Do NOT attach older years (for example years before {current_year}) just because they feel familiar
  - Only use a past year or omit the current year if the user named that period or asked for history, evolution, or a timeline
  
  ## Entity Fidelity
  - Copy product, model, and brand names EXACTLY from the research question
  - Do NOT replace unknown or new names with similar older products from training data
  - If a name looks unfamiliar, keep it and search for it anyway
  
  ## Guidelines for Effective Search Queries
  
  ### Do:
  - Use specific keywords related to the topic
  - Vary the queries to cover different aspects of the question
  - Use technical terms that experts in the field would use
  - Include different phrasings to capture diverse sources
  
  ### Don't:
  - Make queries too broad or generic
  - Use questions as queries (use keyword phrases instead)
  - Repeat the same query with minor variations
  - Include overly long phrases (keep under 10 words)
  - Substitute a different product than the one the user named
  
  ## Output Format
  Respond ONLY with a valid JSON object. Do not include any other text:
  
  ```json
  {{
    "queries": [
      "first search query",
      "second search query",
      "third search query"
    ],
    "reasoning": "Brief explanation of why these queries were chosen and what aspects they cover"
  }}
  ```
  
  ## Examples
  
  ### Example 1
  Question: "What are the latest developments in quantum computing?"
  Persona: "Quantum Computing Researcher"
  
  Response:
  ```json
  {{
    "queries": [
      "quantum computing breakthroughs {current_year}",
      "quantum supremacy latest experiments IBM Google",
      "quantum error correction advances {current_year}"
    ],
    "reasoning": "These queries cover recent breakthroughs, major players' experiments, and technical advances in error correction - three key aspects of quantum computing progress"
  }}
  ```
  
  ### Example 2
  Question: "Compare Nvidia RTX Spark and Apple Mac Studio M5"
  Persona: "Hardware Analyst specializing in workstation GPUs and Apple silicon"
  
  Response:
  ```json
  {{
    "queries": [
      "Nvidia RTX Spark specs launch {current_year}",
      "Apple Mac Studio M5 review {current_year}",
      "RTX Spark vs Mac Studio M5 comparison"
    ],
    "reasoning": "Queries keep both product names verbatim, target current-year launch/specs coverage, and a direct comparison. They do not substitute older RTX or Mac Studio generations."
  }}
  ```
  
  ### Example 3
  Question: "How do transformers work in NLP?"
  Persona: "Deep Learning Researcher specializing in NLP"
  
  Response:
  ```json
  {{
    "queries": [
      "transformer architecture self-attention mechanism explained",
      "encoder decoder transformer NLP tutorial",
      "attention is all you need paper summary"
    ],
    "reasoning": "These queries cover the core mechanism (self-attention), the overall architecture, and the foundational paper - providing comprehensive understanding"
  }}
  ```

input_variables:
  - name: "assistant_persona"
    description: "Selected expert persona title"
    type: "string"
    required: true
    example: "Quantum Computing Researcher"
  
  - name: "assistant_expertise"
    description: "Expert's areas of knowledge"
    type: "string"
    required: true
    example: "Quantum algorithms, quantum supremacy, QPU architectures"
  
  - name: "assistant_approach"
    description: "Expert's approach to answering"
    type: "string"
    required: true
    example: "Focus on recent breakthroughs with accessible explanations"
  
  - name: "user_question"
    description: "Original research question"
    type: "string"
    required: true
    example: "What are the latest developments in quantum computing?"
  
  - name: "num_queries"
    description: "Number of search queries to generate"
    type: "integer"
    required: true
    default: 2
    example: 3

  - name: "current_date"
    description: "Calendar date when research is run, injected by the pipeline"
    type: "string"
    required: true
    example: "Thursday, 03 September 2026"

  - name: "current_year"
    description: "Calendar year when research is run, injected by the pipeline"
    type: "string"
    required: true
    example: "2026"

output_format:
  type: "json"
  schema:
    queries:
      type: "array"
      items: "string"
      minItems: 1
      maxItems: 10
    reasoning: "string"

metadata:
  author: "Research Engine Team"
  created: "2026-09-01"
  updated: "2026-09-03"
  tags:
    - "search"
    - "queries"
    - "web-search"
    - "stage-2"
